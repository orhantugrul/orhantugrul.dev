<!doctype html>
<html lang="en" class="scheme-dark motion-safe:scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f6f6f4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0c0e"
    />
    <script>
      // Runs before first paint so the theme never flashes. Dark is the
      // default; `.light` is the override. Follows the OS for as long as
      // no explicit choice is stored.
      (function () {
        var key = "theme";
        try {
          var media = window.matchMedia("(prefers-color-scheme: light)");
          var stored = localStorage.getItem(key);
          function apply(light) {
            document.documentElement.classList.toggle("light", light);
            document.documentElement.style.colorScheme = light
              ? "light"
              : "dark";
          }
          apply(stored ? stored === "light" : media.matches);
          media.addEventListener("change", function (event) {
            if (localStorage.getItem(key)) return;
            apply(event.matches);
          });
        } catch (error) {
          // Storage blocked; stay on the dark default.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="antialiased **:motion-reduce:animate-none **:motion-reduce:transition-none"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
