<!doctype html>
<html lang="en" class="scheme-light-dark motion-safe:scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f4f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-background text-base text-foreground antialiased selection:bg-selection **:focus-visible:rounded-xs **:focus-visible:outline-2 **:focus-visible:outline-offset-2 **:focus-visible:outline-ring **:motion-reduce:animate-none **:motion-reduce:transition-none"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
